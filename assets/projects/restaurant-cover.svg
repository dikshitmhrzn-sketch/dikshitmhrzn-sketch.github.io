<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Restaurant Management System illustrated cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g transform="translate(600 330)">
    <circle r="132" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle r="104" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.85"/>
    <circle r="78" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- plate -->
    <circle r="40" fill="none" stroke="#22d3ee" stroke-width="4"/>
    <circle r="26" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.55"/>

    <!-- fork -->
    <g stroke="#22d3ee" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M-118 -46v34a14 14 0 0 0 14 14h0a14 14 0 0 0 14-14v-34"/>
      <path d="M-104 -46v52"/>
      <path d="M-90 -46v34a14 14 0 0 1-14 14"/>
      <path d="M-104 -46v20"/>
      <path d="M-104 4 8 4"/>
    </g>

    <!-- knife -->
    <g stroke="#7c3aed" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M118 -52c-16 10-22 28-22 46s6 30 22 38"/>
      <path d="M118 -52v92"/>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,system-ui,sans-serif" text-anchor="middle">
    <text x="600" y="560" fill="#f1f5f9" font-size="34" font-weight="600">Restaurant Management System</text>
    <text x="600" y="602" fill="#64748b" font-size="20" font-weight="500" letter-spacing="2">PHP &#183; MYSQL &#183; RESERVATIONS &amp; ORDERS</text>
  </g>
</svg>
